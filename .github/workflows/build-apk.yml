name: Build Android APK (Unsigned Demo)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Initialize and Copy Capacitor Android
        run: |
          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android

      - name: Build Unsigned Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Unsigned Demo APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: editor-id-news-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
